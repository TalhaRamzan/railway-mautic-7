# Small prefork pool. Each Apache child runs PHP (mod_php) and can use up to
# PHP_INI_VALUE_MEMORY_LIMIT, so MaxRequestWorkers is the main RAM (and bill) cap.
# Values come from environment variables with defaults set in the Dockerfile.
<IfModule mpm_prefork_module>
    StartServers            ${APACHE_START_SERVERS}
    MinSpareServers         ${APACHE_MIN_SPARE_SERVERS}
    MaxSpareServers         ${APACHE_MAX_SPARE_SERVERS}
    MaxRequestWorkers       ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild  ${APACHE_MAX_CONNECTIONS_PER_CHILD}
</IfModule>
