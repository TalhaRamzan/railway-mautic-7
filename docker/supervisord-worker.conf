; Supervisor config for the "mautic_worker" service. Replaces the upstream file.
; Differences from upstream:
;  - consumers exit gracefully after --time-limit / --memory-limit and are restarted by
;    supervisor: memory stays flat and each restart re-reads config/local.php;
;  - slower polling (--sleep) on the database (doctrine) transport to save CPU;
;  - a "config-sync" program pulls local.php saved by the web service.
; Process counts come from DOCKER_MAUTIC_WORKERS_CONSUME_* (default 1 each, see Dockerfile).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root

[program:config-sync]
command=/usr/local/bin/mautic-config-sync pull-loop
user=www-data
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:messenger-consume-email]
command=php /var/www/html/bin/console messenger:consume email --time-limit=600 --memory-limit=192M --sleep=2
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:messenger-consume-hit]
command=php /var/www/html/bin/console messenger:consume hit --time-limit=600 --memory-limit=192M --sleep=2
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_HIT)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:messenger-consume-failed]
command=php /var/www/html/bin/console messenger:consume failed --time-limit=900 --memory-limit=192M --sleep=30
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_FAILED)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
